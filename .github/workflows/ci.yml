name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The plugin is loaded by cpa as a native c-shared library, so the cgo
      # build is the one that actually has to work.
      - name: Build plugin
        env:
          CGO_ENABLED: "1"
        run: make build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: anti-model-fallback-${{ matrix.os }}
          path: dist/**/anti-model-fallback-*
          if-no-files-found: error
