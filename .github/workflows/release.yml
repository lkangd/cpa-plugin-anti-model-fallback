name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true
        default: "0.0.0-test"

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # cgo cannot be cross-compiled without a target toolchain, so each
      # artifact is built on a runner of its own architecture.
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: so
          # macos-13 is retired; macos-15-intel is the current x86_64 image.
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            ext: dylib
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: dylib

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building version ${version}"

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: make build VERSION=${{ steps.version.outputs.version }}

      - name: Stage artifact
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          src="dist/${{ matrix.goos }}/${{ matrix.goarch }}/anti-model-fallback-v${version}.${{ matrix.ext }}"
          mkdir -p release
          cp "$src" "release/anti-model-fallback-v${version}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }}"
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: anti-model-fallback-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Native CLIProxyAPI plugin builds. Download the file matching your
            platform and drop it into `<plugins.dir>/<goos>/<goarch>/`, for example
            `~/.cli-proxy-api/plugins/darwin/arm64/`.

            The host must be a cpa build with plugin support
            (`X-Cpa-Support-Plugin: 1`). See the README for configuration.
